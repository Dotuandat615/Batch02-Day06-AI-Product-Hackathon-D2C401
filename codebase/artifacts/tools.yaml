# starter_v0 — tool declarations cho AI Local Food Guide.
# Tên tool phải sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: >
      Hỏi người dùng để thu thập thông tin hoặc xác nhận hành động.
      Dùng khi: (1) cần hỏi MCQ về bữa ăn, (2) thiếu vị trí GPS,
      (3) cần xác nhận trước khi mở Google Maps.
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi gửi người dùng."}
        response_type:
          type: string
          enum: [text, yes_no, choice]
          default: "text"
          description: "'choice' cho MCQ, 'text' cho hỏi tự do, 'yes_no' cho xác nhận."
        options:
          type: array
          default: []
          items: {type: string}
          description: "Các lựa chọn nếu response_type là 'choice'."
      required: [question]

  - name: search_nearby_restaurants
    description: >
      Tìm danh sách quán ăn / cafe / nhà hàng gần vị trí người dùng.
      Trả về tên quán, địa chỉ, khoảng cách, rating, giờ mở cửa, giá,
      tiện ích, số điện thoại, link Google Maps và review nổi bật.
      Dùng khi người dùng hỏi 'quán ăn gần đây', 'tìm cafe',
      'đặc sản vùng này', hoặc bất kỳ yêu cầu tìm nơi ăn uống theo vị trí.
    parameters:
      type: object
      properties:
        query: {type: string, description: "Từ khoá tìm kiếm. Nên dùng tiếng Việt."}
        lat: {type: number, description: "Vĩ độ (latitude) của người dùng."}
        lng: {type: number, description: "Kinh độ (longitude) của người dùng."}
        radius_km: {type: number, default: 1.5, description: "Bán kính tìm kiếm tính bằng km."}
        max_results: {type: integer, default: 5, description: "Số quán tối đa trả về."}
      required: [query]

  - name: format_recommendations
    description: >
      Format danh sách quán gợi ý thành output đẹp cho người dùng.
      Tính khoảng cách, tạo Google Maps link, format với emoji.
      Gọi tool này ở bước cuối cùng sau khi đã chọn được 3 quán phù hợp.
    parameters:
      type: object
      properties:
        recommendations:
          type: array
          default: []
          description: "Danh sách quán gợi ý (tối đa 3)"
          items:
            type: object
            properties:
              place_id: {type: string}
              name: {type: string}
              vicinity: {type: string}
              rating: {type: number}
              reason: {type: string, description: "Lý do 1 câu tại sao phù hợp"}
              confidence: {type: string, enum: [high, medium, low]}
              geometry:
                type: object
                properties:
                  location:
                    type: object
                    properties:
                      lat: {type: number}
                      lng: {type: number}
              warning: {type: string, description: "Cảnh báo nếu có (review cũ, quán có thể đóng)"}
              thumbnail: {type: string, description: "URL ảnh thumbnail của quán (lấy từ search_nearby_restaurants)"}
              maps_url: {type: string, description: "Link Google Maps chỉ đường đến quán (lấy từ search_nearby_restaurants)"}
        user_lat: {type: number, description: "Vĩ độ người dùng (để tính khoảng cách)."}
        user_lng: {type: number, description: "Kinh độ người dùng (để tính khoảng cách)."}
      required: [recommendations]
